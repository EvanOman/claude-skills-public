<body><nav class="sw-site-nav" aria-label="Site"><a href="../">← System Walkthroughs</a><a href="https://evanoman.com/">evanoman.com</a></nav><main id="walkthrough"></main><noscript><article class="sw"><h1>A reader can outlive a WAL commit</h1><p>SQLite WAL: follow one held snapshot, a successful writer commit, and a checkpoint that cannot yet finish.</p><p>Why can the writer commit while an old reader keeps checkpointing from reaching the end?</p><p>R = reader snapshot end; L = committed WAL end; C = cumulative backfill progress. For readers who know transactions. SQLite 3.54.1, journal_mode=WAL, separate connections on one host, shared-cache disabled, with ordinary shared wal-index coordination. One active WAL-reading transaction holds read mark 6; a writer later commits through 10. Checkpoint calls name main and have no active transaction on their own connection. Automatic checkpoints, crashes, unusual VFS modes, network filesystems and power-loss guarantees are outside this trace.</p><h2>Two files, independent transaction lifetimes</h2><p>Connections and their local operations sit beside storage. WAL + wal-index groups the append-only page frames with shared coordination metadata. File arrows are logical I/O, not network messages. The database can lag the latest committed WAL.</p><ul><li>Reader connection: Owns snapshot end R</li><li>Writer connection: Publishes committed end L</li><li>WAL + wal-index: Frames; read marks; progress C</li><li>Main database file: Receives safe page versions</li><li>Checkpoint operation: In-process SQLite work</li><li>Checkpoint caller: Another SQLite connection</li></ul><ul><li>reader → wal: Read at R (request)</li><li>wal → reader: Snapshot page (return)</li><li>writer → wal: Append + publish commit (data)</li><li>caller → checkpointer: Checkpoint call (request)</li><li>checkpointer → caller: Return rc, L, C (return)</li><li>checkpointer → wal: Inspect read marks (control)</li><li>checkpointer → db: Write safe WAL pages (data)</li></ul><h3>One reader owns an old snapshot</h3><p>The reader uses R = 6 even when L has advanced to 10. A page absent from its WAL view is read from the main database file; this simplified map highlights the WAL hit for P = A.</p><h3>A commit publishes a newer end</h3><p>The writer appends and commits, publishing L = 10. The old reader continues using R = 6; no snapshot update arrow goes to it.</p><h3>The caller receives progress, not an empty-file promise</h3><p>The local checkpoint operation inspects read marks, makes safe file writes, and returns rc plus frame counts L and C. PASSIVE can stop short.</p><h3>Recognize an unfinished PASSIVE checkpoint</h3><p>Under the chosen interleaving, OK with L = 10 and C = 6 means safe progress was made while the held old read mark stopped completion. Other readers or writers can also affect a real checkpoint.</p><h3>Release the transaction, then call again</h3><p>Ending the old reader removes its lock. It does not issue a checkpoint; the application explicitly requests the retry shown here. Even C = L does not promise a zero-byte WAL.</p><h2>One old reader, one commit, two checkpoint calls</h2><ol><li><h3>Pin an old WAL snapshot</h3><p>The reader starts a real read transaction after committed frame 6 and uses a WAL read slot with read mark 6. Page P has value A at frame 6. An open connection alone is insufficient.</p><p>The held read lock protects the snapshot throughout the transaction.</p><p>Local connection state and shared wal-index coordination; no network hop.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 6 already complete.</li><li>WAL + wal-index: L = 6; C = 0; P = A at frame 6.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: No checkpoint request yet.</li></ul></li><li><h3>Commit newer frames</h3><p>A separate writer appends frames through a commit at frame 10, where P becomes B. Its commit succeeds. The old reader still reads A from its R = 6 snapshot.</p><p>Publishing L = 10 permits a new snapshot to include B; it does not advance this reader.</p><p>Writer to WAL storage, then local commit result; no checkpoint promise.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 0. P = A at frame 6; P = B at frame 10.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: No checkpoint request yet.</li></ul></li><li><h3>Ask for PASSIVE</h3><p>A different connection calls sqlite3_wal_checkpoint_v2(db, &quot;main&quot;, PASSIVE, &amp;L, &amp;C). The API passes through B-tree and pager layers to WAL checkpointing.</p><p>The caller asks for safe progress without waiting for transactions to finish.</p><p>In-process API dispatch; the checkpoint operation is not an automatic daemon.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 0. Active old read mark = 6.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: PASSIVE in progress; checkpoint lock acquired.</li></ul></li><li><h3>Return OK with work remaining</h3><p>The held read mark limits safe checkpoint progress to 6. In this schedule, safe page writes advance C to 6; the API returns SQLITE_OK with L = 10 and C = 6.</p><p>Advancing beyond the old read mark could overwrite database pages still needed by the old snapshot. OK reports this PASSIVE attempt succeeded, not that the WAL is empty.</p><p>WAL page content to the main file, then an API return to the checkpoint caller.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 6. WAL frames remain available.</li><li>Main database: Safe page writes made; not the whole latest snapshot.</li><li>Checkpoint caller: PASSIVE returned SQLITE_OK, L = 10, C = 6.</li></ul></li><li><h3>End the old reader</h3><p>The application ends that read transaction, releasing its WAL read lock. This action does not automatically retry the completed checkpoint call.</p><p>The barrier is gone because its owner released it; SQLite did not force the old snapshot forward.</p><p>Local transaction lifetime and shared lock release.</p><ul><li>Reader: Old read transaction ended; its read lock released.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 6. No WAL reader remains.</li><li>Main database: Safe earlier progress; latest backfill incomplete.</li><li>Checkpoint caller: Previous PASSIVE returned OK with C &lt; L; no retry yet.</li></ul></li><li><h3>Explicitly retry and finish</h3><p>With no other active transactions or errors, the caller requests PASSIVE again. Progress can reach C = L = 10. The returned counts include earlier checkpoint work.</p><p>The main file now has required latest pages, while PASSIVE still does not promise a zero-byte WAL. Restart and truncation have separate conditions.</p><p>A second API request, safe file writes, and its return.</p><ul><li>Reader: Old read transaction ended; no reader remains.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 10. WAL not truncated by PASSIVE.</li><li>Main database: All required latest page versions backfilled.</li><li>Checkpoint caller: Second PASSIVE returned SQLITE_OK, L = 10, C = 10.</li></ul></li></ol><h2>Change the checkpoint mode, keep the old snapshot</h2><h3>PASSIVE → release → retry</h3><p>The writer commits, an old reader limits the first PASSIVE call, then the application ends the reader and explicitly retries successfully.</p><p>Source-derived illustration; R = read mark = 6, initial C = 0, and newer committed L = 10. Page P changes from A to B; another page Q has its latest frame at 5 and can be copied safely.</p><p>No concurrent checkpoint, new transaction, I/O failure or automatic checkpoint intervenes. The old reader ends only at the shown release event.</p><p>Checkpoint callers name main, provide both counts, and hold no active transaction of their own. The shown calls and replies are local C API boundaries.</p><ol><li>reader → reader: Start read: R = 6<p>Source-derived illustration. The reader selects and holds WAL read mark 6. It can read P = A.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 6 already complete.</li><li>WAL + wal-index: L = 6; C = 0; P = A at frame 6.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: No checkpoint request yet.</li></ul></li><li>writer → wal: Commit through frame 10<p>Condensed WAL writes include a commit marker and publication of L = 10; P now has B at frame 10. The reader’s R remains 6.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Committed through frame 10; local result pending.</li><li>WAL + wal-index: L = 10; C = 0. P = A at frame 6; P = B at frame 10.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: No checkpoint request yet.</li></ul></li><li>writer → writer: COMMIT returns OK to app<p>Local control event: the writer connection returns a successful COMMIT result to its application; the application has no separate lane here. Power-loss durability settings are outside this illustration.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 0. P = A at frame 6; P = B at frame 10.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: No checkpoint request yet.</li></ul></li><li>reader → reader: Read P again: A<p>The existing transaction continues using frame 6; later committed B is outside its snapshot.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 0. P = A at frame 6; P = B at frame 10.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: No checkpoint request yet.</li></ul></li><li>caller → checkpointer: PASSIVE(main)<p>The separate checkpoint caller requests progress without waiting. API layers are condensed into the checkpoint lane.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 0. Active old read mark = 6.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: PASSIVE in progress; checkpoint lock acquired.</li></ul></li><li>checkpointer → checkpointer: Safe bound = 6<p>Local wal-index inspection finds the held old read mark; it cannot safely pass that mark.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 0. Active old read mark = 6.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: PASSIVE in progress; checkpoint lock acquired.</li></ul></li><li>checkpointer → db: Write safe WAL pages; C = 6<p>The checkpoint operation reads page versions from the WAL and writes safe versions to the main file. C is a progress horizon, not a promise that every earlier frame was copied as a separate page write. Duplicate page versions can be skipped.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 6. Old read mark remains 6.</li><li>Main database: Safe required page versions written; latest snapshot incomplete.</li><li>Checkpoint caller: PASSIVE preparing its return.</li></ul></li><li>checkpointer → caller: OK; L = 10, C = 6<p>The result returns to the invoking connection. Check C &lt; L: the reader is still open and the checkpoint is incomplete.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 6. WAL frames remain available.</li><li>Main database: Safe page writes made; not the whole latest snapshot.</li><li>Checkpoint caller: PASSIVE returned SQLITE_OK, L = 10, C = 6.</li></ul></li><li>reader → reader: End read transaction<p>The application releases the old read lock. No automatic retry is implied.</p><ul><li>Reader: Old read transaction ended; its read lock released.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 6. No WAL reader remains.</li><li>Main database: Safe earlier progress; latest backfill incomplete.</li><li>Checkpoint caller: Previous PASSIVE returned OK with C &lt; L; no retry yet.</li></ul></li><li>caller → checkpointer: PASSIVE(main) again<p>A second explicit call occurs after release. No other reader, writer or checkpoint intervenes in this chosen schedule.</p><ul><li>Reader: Old read transaction ended; no reader remains.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 6. No WAL reader remains.</li><li>Main database: Safe earlier progress; latest backfill incomplete.</li><li>Checkpoint caller: Second PASSIVE request in progress.</li></ul></li><li>checkpointer → db: Write remaining WAL pages<p>Without the old barrier, checkpointing can reach the latest committed end.</p><ul><li>Reader: No old reader remains.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 10; WAL retained.</li><li>Main database: Latest required page versions backfilled.</li><li>Checkpoint caller: Second PASSIVE preparing its return.</li></ul></li><li>checkpointer → caller: OK; L = 10, C = 10<p>Backfill is complete for this log. The physical WAL file need not shrink; PASSIVE is not TRUNCATE.</p><ul><li>Reader: Old read transaction ended; no reader remains.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 10. WAL not truncated by PASSIVE.</li><li>Main database: All required latest page versions backfilled.</li><li>Checkpoint caller: Second PASSIVE returned SQLITE_OK, L = 10, C = 10.</li></ul></li></ol><h3>FULL → waiting declined → BUSY</h3><p>With the same old reader, FULL attempts to wait. The busy handler declines further waiting, so safe partial progress is followed by SQLITE_BUSY. The reader stays old.</p><p>Source-derived alternative schedule starting from the same R = 6 and L = 10 state; no retry from the PASSIVE scenario carries over. Another page Q has its latest frame at 5 and can be copied safely.</p><p>The writer has released its write lock. FULL acquires checkpoint and writer locks, then encounters the old WAL reader.</p><p>A configured busy handler eventually returns 0; any earlier waiting attempts are condensed. No automatic cancellation of the old reader is invented.</p><ol><li>reader → reader: Start read: R = 6<p>Source-derived illustration. The reader selects and holds WAL read mark 6. It can read P = A.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 6 already complete.</li><li>WAL + wal-index: L = 6; C = 0; P = A at frame 6.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: No checkpoint request yet.</li></ul></li><li>writer → wal: Commit through frame 10<p>Condensed WAL writes include a commit marker and publication of L = 10; P now has B at frame 10. The reader’s R remains 6.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Committed through frame 10; local result pending.</li><li>WAL + wal-index: L = 10; C = 0. P = A at frame 6; P = B at frame 10.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: No checkpoint request yet.</li></ul></li><li>writer → writer: COMMIT returns OK to app<p>Local control event: the writer connection returns a successful COMMIT result to its application; the application has no separate lane here. Power-loss durability settings are outside this illustration.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 0. P = A at frame 6; P = B at frame 10.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: No checkpoint request yet.</li></ul></li><li>reader → reader: Read P again: A<p>The existing transaction continues using frame 6; later committed B is outside its snapshot.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 0. P = A at frame 6; P = B at frame 10.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: No checkpoint request yet.</li></ul></li><li>caller → checkpointer: FULL(main)<p>The writer has finished. FULL acquires the writer lock but the older WAL reader is still active.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 0. Old WAL reader still holds 6.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: FULL acquired checkpoint and writer locks; waiting on reader.</li></ul></li><li>checkpointer → checkpointer: Busy handler declines<p>One local waiting decision is shown; any previous retries are condensed. FULL cannot upgrade or end the reader’s transaction. New writer attempts are blocked while this FULL operation owns the writer lock.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 0. Old WAL reader still holds 6.</li><li>Main database: Baseline pages; no new checkpoint yet.</li><li>Checkpoint caller: Further waiting declined; safe partial work pending.</li></ul></li><li>checkpointer → db: Write safe WAL pages; C = 6<p>After waiting is declined, safe work can still advance C to 6, without passing the reader. The unchanged old reader prevents full completion.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 6. Old reader remains.</li><li>Main database: Safe partial page writes; latest backfill incomplete.</li><li>Checkpoint caller: FULL busy handler declined further waiting; returning BUSY.</li></ul></li><li>checkpointer → caller: BUSY; L = 10, C = 6<p>FULL did not achieve its requested completion. The API returns and releases its locks. The old reader still sees A. The application must decide when to end that reader and whether to retry.</p><ul><li>Reader: R = 6 held; page P reads A.</li><li>Writer: Commit through frame 10 returned OK.</li><li>WAL + wal-index: L = 10; C = 6. Old reader remains.</li><li>Main database: Safe partial page writes; latest backfill incomplete.</li><li>Checkpoint caller: FULL returned SQLITE_BUSY, L = 10, C = 6; no retry pending.</li></ul></li></ol><h2>Claims and sources</h2><p>A read transaction keeps its starting mxFrame and ignores later appended frames. It searches the WAL at that snapshot, with the database file as fallback. (source) <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L101-L117">wal.c · reader algorithm</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L3561-L3602">sqlite3WalEndReadTransaction · release read lock</a></p><p>WAL changes commit with a commit-marked frame. On successful commit, the writer publishes mxFrame in the wal-index; this does not rewrite existing readers’ private snapshots. (source) <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L101-L117">wal.c · reader algorithm</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L4320-L4351">wal.c · publish a successful commit</a></p><p>An active WAL reader holds a shared read lock. Its read mark cannot change while held; checkpointing cannot pass any active WAL read mark. (source) <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L335-L388">wal.c · read marks, backfill and WAL reuse</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2310-L2332">walCheckpoint · compute safe progress</a></p><p>PASSIVE makes progress without waiting for readers or writers and never calls the busy handler. Reader contention can leave it incomplete with SQLITE_OK. (source) <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/sqlite.h.in#L10155-L10189">Checkpoint API · PASSIVE, FULL, RESTART, TRUNCATE</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2384-L2432">walCheckpoint · page writes and progress</a></p><p>The checkpoint iterator selects the latest frame for each page, then skips frames outside the safe bound or already covered by prior progress. Advancing C does not mean copying each frame as a separate page write. (source) <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L1786-L1799">walIteratorNext · latest frame per page</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2384-L2432">walCheckpoint · page writes and progress</a></p><p>pnLog reports WAL frames and pnCkpt reports cumulative checkpointed progress, including earlier calls. These are frame counts, not bytes or this call’s copied-page count. (source) <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/sqlite.h.in#L10197-L10221">Checkpoint API · cumulative counts and busy fallback</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L4475-L4517">sqlite3WalCheckpoint · output frame counts</a></p><p>For a named database, sqlite3_wal_checkpoint_v2 dispatches through sqlite3Checkpoint, sqlite3BtreeCheckpoint and sqlite3PagerCheckpoint to sqlite3WalCheckpoint, then returns the result to its caller. (source) <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/main.c#L2582-L2642">sqlite3_wal_checkpoint_v2 · entry and result</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/main.c#L2679-L2702">sqlite3Checkpoint · database dispatch</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/btree.c#L11403-L11421">sqlite3BtreeCheckpoint · pager dispatch</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/pager.c#L7580-L7614">sqlite3PagerCheckpoint · WAL dispatch</a></p><p>FULL waits via the busy handler for the writer and older readers; it blocks new writers while pending. If further waiting is declined, it makes passive-style progress and returns SQLITE_BUSY. (source) <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/sqlite.h.in#L10155-L10189">Checkpoint API · PASSIVE, FULL, RESTART, TRUNCATE</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/sqlite.h.in#L10197-L10221">Checkpoint API · cumulative counts and busy fallback</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2310-L2332">walCheckpoint · compute safe progress</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2384-L2432">walCheckpoint · page writes and progress</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2440-L2444">walCheckpoint · incomplete FULL returns BUSY</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L4444-L4451">sqlite3WalCheckpoint · writer-lock fallback</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L4484-L4488">sqlite3WalCheckpoint · counts on OK or BUSY</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L4513-L4517">sqlite3WalCheckpoint · mode fallback returns BUSY</a></p><p>In this chosen schedule, ending the only old WAL reader releases its read lock. A later checkpoint can reach the latest committed frame if no other reader, writer, checkpoint or I/O error intervenes. Ending the reader does not itself issue that checkpoint. (inference) <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L3561-L3602">sqlite3WalEndReadTransaction · release read lock</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2310-L2332">walCheckpoint · compute safe progress</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2384-L2432">walCheckpoint · page writes and progress</a></p><p>Completed backfill is distinct from WAL restart and truncation. WAL reuse requires all content backfilled and no WAL readers. RESTART additionally waits for WAL readers; TRUNCATE shrinks the WAL on success. (source) <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L335-L388">wal.c · read marks, backfill and WAL reuse</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/sqlite.h.in#L10155-L10189">Checkpoint API · PASSIVE, FULL, RESTART, TRUNCATE</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2435-L2455">walCheckpoint · completion versus restart</a></p><p>The illustrative WAL begins at committed end 6, then grows to committed end 10; the sole old reader uses read mark 6. With checkpoint access otherwise available and no errors, progress can stop at 6 and later reach 10. Another page Q has its latest version at frame 5 and is eligible for a safe page write. Numbers are chosen frame indices, not measured SQL output. (inference) <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2310-L2332">walCheckpoint · compute safe progress</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2384-L2432">walCheckpoint · page writes and progress</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L4475-L4517">sqlite3WalCheckpoint · output frame counts</a></p><p>A connection without an active read transaction holds none of these reader locks. A slot 0 read transaction reads only the database file and can block all backfill while its shared slot 0 lock is held. This guide traces a nonzero-slot reader whose read mark bounds safe progress. (source) <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L335-L388">wal.c · read marks, backfill and WAL reuse</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2340-L2345">walCheckpoint · slot 0 lock before backfill</a> · <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L3216-L3243">walTryBeginRead · database-only reader blocks backfill</a></p><p>PASSIVE can return SQLITE_BUSY if another checkpoint already owns the checkpoint lock. That lock failure does not call the busy handler. (source) <a href="https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/sqlite.h.in#L10197-L10221">Checkpoint API · cumulative counts and busy fallback</a></p><h2>Limits</h2><p>AI-authored explanation from public primary sources. SQLite’s source is public domain. Renderer licensing remains with the bundled skill.</p><p>Frame indices 6 and 10, a safely copyable page Q at frame 5, page values A and B, and event ordering are source-derived illustrations, not observed runtime measurements. All repetitive frame writes and API layers are condensed.</p><p>R is the existing reader’s snapshot end, L is the committed log end, and C is cumulative backfill progress. The chosen read mark equals R; actual read-slot selection and WAL resets may produce other values.</p><p>C = 6 is a safe progress horizon, not six physical page writes. The checkpoint iterator can skip older versions of pages. This guide does not model file bytes, page caches or each lock transition.</p><p>The checkpoint operation is local SQLite code invoked by a connection. It is not a separate server or automatic worker; arrows to files describe logical I/O.</p><p>This trace assumes checkpoint lock acquisition succeeds and no I/O error occurs. Another checkpoint can instead cause immediate SQLITE_BUSY, even for PASSIVE.</p><p>No SQLite binary was built or executed for this guide. The pinned implementation and API contract establish the behavior; browser tests verify only the interactive explanation.</p></article></noscript><script id="walkthrough-model" type="application/json">{"version":1,"title":"A reader can outlive a WAL commit","subtitle":"SQLite WAL: follow one held snapshot, a successful writer commit, and a checkpoint that cannot yet finish.","question":"Why can the writer commit while an old reader keeps checkpointing from reaching the end?","scope":"R = reader snapshot end; L = committed WAL end; C = cumulative backfill progress. For readers who know transactions. SQLite 3.54.1, journal_mode=WAL, separate connections on one host, shared-cache disabled, with ordinary shared wal-index coordination. One active WAL-reading transaction holds read mark 6; a writer later commits through 10. Checkpoint calls name main and have no active transaction on their own connection. Automatic checkpoints, crashes, unusual VFS modes, network filesystems and power-loss guarantees are outside this trace.","navigation":[{"label":"← System Walkthroughs","url":"../"},{"label":"evanoman.com","url":"https://evanoman.com/"}],"project":{"name":"SQLite","repository":"https://github.com/sqlite/sqlite","revision":"57520227c95396ce39ba6ecaac8d475b78dd3964","version":"3.54.1 · version-3.54.1","license":"SQLite source is public domain. This is an AI-authored source paraphrase; no upstream text or diagrams are reproduced."},"sources":[{"id":"reader","label":"wal.c · reader algorithm","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L101-L117"},{"id":"marks","label":"wal.c · read marks, backfill and WAL reuse","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L335-L388"},{"id":"commit","label":"wal.c · publish a successful commit","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L4320-L4351"},{"id":"bound","label":"walCheckpoint · compute safe progress","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2310-L2332"},{"id":"iterator","label":"walIteratorNext · latest frame per page","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L1786-L1799"},{"id":"copy","label":"walCheckpoint · page writes and progress","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2384-L2432"},{"id":"release","label":"sqlite3WalEndReadTransaction · release read lock","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L3561-L3602"},{"id":"api-entry","label":"sqlite3_wal_checkpoint_v2 · entry and result","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/main.c#L2582-L2642"},{"id":"api-route","label":"sqlite3Checkpoint · database dispatch","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/main.c#L2679-L2702"},{"id":"btree-route","label":"sqlite3BtreeCheckpoint · pager dispatch","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/btree.c#L11403-L11421"},{"id":"pager-route","label":"sqlite3PagerCheckpoint · WAL dispatch","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/pager.c#L7580-L7614"},{"id":"modes","label":"Checkpoint API · PASSIVE, FULL, RESTART, TRUNCATE","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/sqlite.h.in#L10155-L10189"},{"id":"counts","label":"Checkpoint API · cumulative counts and busy fallback","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/sqlite.h.in#L10197-L10221"},{"id":"output","label":"sqlite3WalCheckpoint · output frame counts","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L4475-L4517"},{"id":"restart","label":"walCheckpoint · completion versus restart","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2435-L2455"},{"id":"wal-doc","label":"Official WAL overview · concurrency","url":"https://sqlite.org/wal.html#concurrency","note":"Live official documentation snapshot acquired 2026-10-30; not pinned to this Git revision. Core claims above are reconciled with pinned source."},{"id":"slot-zero-copy","label":"walCheckpoint · slot 0 lock before backfill","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2340-L2345"},{"id":"slot-zero-reader","label":"walTryBeginRead · database-only reader blocks backfill","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L3216-L3243"},{"id":"full-incomplete","label":"walCheckpoint · incomplete FULL returns BUSY","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L2440-L2444"},{"id":"full-writer-fallback","label":"sqlite3WalCheckpoint · writer-lock fallback","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L4444-L4451"},{"id":"checkpoint-count-results","label":"sqlite3WalCheckpoint · counts on OK or BUSY","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L4484-L4488"},{"id":"full-mode-return","label":"sqlite3WalCheckpoint · mode fallback returns BUSY","url":"https://github.com/sqlite/sqlite/blob/57520227c95396ce39ba6ecaac8d475b78dd3964/src/wal.c#L4513-L4517"}],"claims":[{"id":"snapshot","kind":"source","text":"A read transaction keeps its starting mxFrame and ignores later appended frames. It searches the WAL at that snapshot, with the database file as fallback.","sources":["reader","release"]},{"id":"commit-publish","kind":"source","text":"WAL changes commit with a commit-marked frame. On successful commit, the writer publishes mxFrame in the wal-index; this does not rewrite existing readers’ private snapshots.","sources":["reader","commit"]},{"id":"readmark","kind":"source","text":"An active WAL reader holds a shared read lock. Its read mark cannot change while held; checkpointing cannot pass any active WAL read mark.","sources":["marks","bound"]},{"id":"passive","kind":"source","text":"PASSIVE makes progress without waiting for readers or writers and never calls the busy handler. Reader contention can leave it incomplete with SQLITE_OK.","sources":["modes","copy"]},{"id":"backfill-horizon","kind":"source","text":"The checkpoint iterator selects the latest frame for each page, then skips frames outside the safe bound or already covered by prior progress. Advancing C does not mean copying each frame as a separate page write.","sources":["iterator","copy"]},{"id":"count-meaning","kind":"source","text":"pnLog reports WAL frames and pnCkpt reports cumulative checkpointed progress, including earlier calls. These are frame counts, not bytes or this call’s copied-page count.","sources":["counts","output"]},{"id":"api-path","kind":"source","text":"For a named database, sqlite3_wal_checkpoint_v2 dispatches through sqlite3Checkpoint, sqlite3BtreeCheckpoint and sqlite3PagerCheckpoint to sqlite3WalCheckpoint, then returns the result to its caller.","sources":["api-entry","api-route","btree-route","pager-route"]},{"id":"full-busy","kind":"source","text":"FULL waits via the busy handler for the writer and older readers; it blocks new writers while pending. If further waiting is declined, it makes passive-style progress and returns SQLITE_BUSY.","sources":["modes","counts","bound","copy","full-incomplete","full-writer-fallback","checkpoint-count-results","full-mode-return"]},{"id":"release-retry","kind":"inference","text":"In this chosen schedule, ending the only old WAL reader releases its read lock. A later checkpoint can reach the latest committed frame if no other reader, writer, checkpoint or I/O error intervenes. Ending the reader does not itself issue that checkpoint.","sources":["release","bound","copy"]},{"id":"file-not-empty","kind":"source","text":"Completed backfill is distinct from WAL restart and truncation. WAL reuse requires all content backfilled and no WAL readers. RESTART additionally waits for WAL readers; TRUNCATE shrinks the WAL on success.","sources":["marks","modes","restart"]},{"id":"illustration","kind":"inference","text":"The illustrative WAL begins at committed end 6, then grows to committed end 10; the sole old reader uses read mark 6. With checkpoint access otherwise available and no errors, progress can stop at 6 and later reach 10. Another page Q has its latest version at frame 5 and is eligible for a safe page write. Numbers are chosen frame indices, not measured SQL output.","sources":["bound","copy","output"]},{"id":"not-all-readers","kind":"source","text":"A connection without an active read transaction holds none of these reader locks. A slot 0 read transaction reads only the database file and can block all backfill while its shared slot 0 lock is held. This guide traces a nonzero-slot reader whose read mark bounds safe progress.","sources":["marks","slot-zero-copy","slot-zero-reader"]},{"id":"checkpoint-lock","kind":"source","text":"PASSIVE can return SQLITE_BUSY if another checkpoint already owns the checkpoint lock. That lock failure does not call the busy handler.","sources":["counts"]}],"roles":[{"id":"reader","label":"Snapshot owner","color":"blue"},{"id":"writer","label":"Commit operation","color":"violet"},{"id":"control","label":"Checkpoint operation","color":"amber"},{"id":"wal","label":"WAL + coordination","color":"teal"},{"id":"db","label":"Database file","color":"slate"}],"takeaways":[{"text":"The old reader keeps A after the writer has committed B. An open connection without an active read transaction creates no reader-lock barrier.","claims":["snapshot","not-all-readers"]},{"text":"PASSIVE may return OK with C \u003c L. Compare cumulative checkpoint progress with committed WAL frames.","claims":["passive","count-meaning"]},{"text":"End the old transaction, then retry checkpointing. FULL may wait and return BUSY; completed backfill still differs from truncation.","claims":["release-retry","full-busy","file-not-empty"]}],"limits":["AI-authored explanation from public primary sources. SQLite’s source is public domain. Renderer licensing remains with the bundled skill.","Frame indices 6 and 10, a safely copyable page Q at frame 5, page values A and B, and event ordering are source-derived illustrations, not observed runtime measurements. All repetitive frame writes and API layers are condensed.","R is the existing reader’s snapshot end, L is the committed log end, and C is cumulative backfill progress. The chosen read mark equals R; actual read-slot selection and WAL resets may produce other values.","C = 6 is a safe progress horizon, not six physical page writes. The checkpoint iterator can skip older versions of pages. This guide does not model file bytes, page caches or each lock transition.","The checkpoint operation is local SQLite code invoked by a connection. It is not a separate server or automatic worker; arrows to files describe logical I/O.","This trace assumes checkpoint lock acquisition succeeds and no I/O error occurs. Another checkpoint can instead cause immediate SQLITE_BUSY, even for PASSIVE.","No SQLite binary was built or executed for this guide. The pinned implementation and API contract establish the behavior; browser tests verify only the interactive explanation."],"map":{"title":"Two files, independent transaction lifetimes","description":"Connections and their local operations sit beside storage. WAL + wal-index groups the append-only page frames with shared coordination metadata. File arrows are logical I/O, not network messages. The database can lag the latest committed WAL.","width":1000,"height":700,"nodes":[{"id":"reader","label":"Reader connection","detail":"Owns snapshot end R","role":"reader","x":40,"y":40,"w":210,"h":90},{"id":"writer","label":"Writer connection","detail":"Publishes committed end L","role":"writer","x":40,"y":300,"w":210,"h":90},{"id":"wal","label":"WAL + wal-index","detail":"Frames; read marks; progress C","role":"wal","x":390,"y":170,"w":210,"h":90},{"id":"db","label":"Main database file","detail":"Receives safe page versions","role":"db","x":760,"y":170,"w":210,"h":90},{"id":"checkpointer","label":"Checkpoint operation","detail":"In-process SQLite work","role":"control","x":390,"y":460,"w":210,"h":90},{"id":"caller","label":"Checkpoint caller","detail":"Another SQLite connection","role":"control","x":760,"y":460,"w":210,"h":90}],"edges":[{"id":"read","from":"reader","to":"wal","label":"Read at R","kind":"request","via":[{"x":350,"y":85},{"x":350,"y":310}]},{"id":"read-return","from":"wal","to":"reader","label":"Snapshot page","kind":"return","via":[{"x":370,"y":170},{"x":145,"y":170}]},{"id":"append","from":"writer","to":"wal","label":"Append + publish commit","kind":"data"},{"id":"checkpoint","from":"caller","to":"checkpointer","label":"Checkpoint call","kind":"request"},{"id":"checkpoint-return","from":"checkpointer","to":"caller","label":"Return rc, L, C","kind":"return","via":[{"x":495,"y":630},{"x":865,"y":630}]},{"id":"bound","from":"checkpointer","to":"wal","label":"Inspect read marks","kind":"control"},{"id":"backfill","from":"checkpointer","to":"db","label":"Write safe WAL pages","kind":"data"}],"lenses":[{"id":"snapshot","label":"Reader’s view","title":"One reader owns an old snapshot","body":"The reader uses R = 6 even when L has advanced to 10. A page absent from its WAL view is read from the main database file; this simplified map highlights the WAL hit for P = A.","nodes":["reader","wal","db"],"edges":["read","read-return"],"claims":["snapshot","illustration"]},{"id":"commit","label":"Commit path","title":"A commit publishes a newer end","body":"The writer appends and commits, publishing L = 10. The old reader continues using R = 6; no snapshot update arrow goes to it.","nodes":["writer","wal","reader"],"edges":["append"],"claims":["commit-publish","snapshot"]},{"id":"checkpoint","label":"Checkpoint path","title":"The caller receives progress, not an empty-file promise","body":"The local checkpoint operation inspects read marks, makes safe file writes, and returns rc plus frame counts L and C. PASSIVE can stop short.","nodes":["caller","checkpointer","wal","db"],"edges":["checkpoint","bound","backfill","checkpoint-return"],"claims":["api-path","readmark","passive","count-meaning"]}],"intents":[{"id":"diagnose","label":"Interpret OK + C \u003c L","title":"Recognize an unfinished PASSIVE checkpoint","body":"Under the chosen interleaving, OK with L = 10 and C = 6 means safe progress was made while the held old read mark stopped completion. Other readers or writers can also affect a real checkpoint.","nodes":["reader","caller","checkpointer","wal","db"],"edges":["bound","backfill","checkpoint-return"],"claims":["passive","count-meaning","illustration"]},{"id":"finish","label":"Finish after release","title":"Release the transaction, then call again","body":"Ending the old reader removes its lock. It does not issue a checkpoint; the application explicitly requests the retry shown here. Even C = L does not promise a zero-byte WAL.","nodes":["reader","caller","checkpointer","wal","db"],"edges":["checkpoint","backfill","checkpoint-return"],"claims":["release-retry","file-not-empty"]}]},"walkthrough":{"title":"One old reader, one commit, two checkpoint calls","intro":"A source-derived schedule with chosen frame indices. Each selectable step includes a complete post-step state so it can be read in any order. The reader’s WAL hit for P stays A until that transaction ends.","steps":[{"id":"pin","title":"Pin an old WAL snapshot","body":"The reader starts a real read transaction after committed frame 6 and uses a WAL read slot with read mark 6. Page P has value A at frame 6. An open connection alone is insufficient.","why":"The held read lock protects the snapshot throughout the transaction.","boundary":"Local connection state and shared wal-index coordination; no network hop.","nodes":["reader","wal"],"edges":["read","read-return"],"claims":["snapshot","readmark","not-all-readers","illustration"],"state":[{"owner":"Reader","detail":"R = 6 held; page P reads A."},{"owner":"Writer","detail":"Commit through frame 6 already complete."},{"owner":"WAL + wal-index","detail":"L = 6; C = 0; P = A at frame 6."},{"owner":"Main database","detail":"Baseline pages; no new checkpoint yet."},{"owner":"Checkpoint caller","detail":"No checkpoint request yet."}]},{"id":"commit","title":"Commit newer frames","body":"A separate writer appends frames through a commit at frame 10, where P becomes B. Its commit succeeds. The old reader still reads A from its R = 6 snapshot.","why":"Publishing L = 10 permits a new snapshot to include B; it does not advance this reader.","boundary":"Writer to WAL storage, then local commit result; no checkpoint promise.","nodes":["writer","reader","wal"],"edges":["append","read-return"],"claims":["snapshot","commit-publish","illustration"],"state":[{"owner":"Reader","detail":"R = 6 held; page P reads A."},{"owner":"Writer","detail":"Commit through frame 10 returned OK."},{"owner":"WAL + wal-index","detail":"L = 10; C = 0. P = A at frame 6; P = B at frame 10."},{"owner":"Main database","detail":"Baseline pages; no new checkpoint yet."},{"owner":"Checkpoint caller","detail":"No checkpoint request yet."}]},{"id":"request","title":"Ask for PASSIVE","body":"A different connection calls sqlite3_wal_checkpoint_v2(db, \"main\", PASSIVE, &L, &C). The API passes through B-tree and pager layers to WAL checkpointing.","why":"The caller asks for safe progress without waiting for transactions to finish.","boundary":"In-process API dispatch; the checkpoint operation is not an automatic daemon.","nodes":["caller","checkpointer","wal"],"edges":["checkpoint","bound"],"claims":["api-path","passive","checkpoint-lock"],"state":[{"owner":"Reader","detail":"R = 6 held; page P reads A."},{"owner":"Writer","detail":"Commit through frame 10 returned OK."},{"owner":"WAL + wal-index","detail":"L = 10; C = 0. Active old read mark = 6."},{"owner":"Main database","detail":"Baseline pages; no new checkpoint yet."},{"owner":"Checkpoint caller","detail":"PASSIVE in progress; checkpoint lock acquired."}]},{"id":"partial","title":"Return OK with work remaining","body":"The held read mark limits safe checkpoint progress to 6. In this schedule, safe page writes advance C to 6; the API returns SQLITE_OK with L = 10 and C = 6.","why":"Advancing beyond the old read mark could overwrite database pages still needed by the old snapshot. OK reports this PASSIVE attempt succeeded, not that the WAL is empty.","boundary":"WAL page content to the main file, then an API return to the checkpoint caller.","nodes":["reader","wal","db","checkpointer","caller"],"edges":["bound","backfill","checkpoint-return"],"claims":["readmark","passive","count-meaning","illustration","file-not-empty"],"state":[{"owner":"Reader","detail":"R = 6 held; page P reads A."},{"owner":"Writer","detail":"Commit through frame 10 returned OK."},{"owner":"WAL + wal-index","detail":"L = 10; C = 6. WAL frames remain available."},{"owner":"Main database","detail":"Safe page writes made; not the whole latest snapshot."},{"owner":"Checkpoint caller","detail":"PASSIVE returned SQLITE_OK, L = 10, C = 6."}]},{"id":"release","title":"End the old reader","body":"The application ends that read transaction, releasing its WAL read lock. This action does not automatically retry the completed checkpoint call.","why":"The barrier is gone because its owner released it; SQLite did not force the old snapshot forward.","boundary":"Local transaction lifetime and shared lock release.","nodes":["reader","wal"],"edges":[],"claims":["release-retry"],"state":[{"owner":"Reader","detail":"Old read transaction ended; its read lock released."},{"owner":"Writer","detail":"Commit through frame 10 returned OK."},{"owner":"WAL + wal-index","detail":"L = 10; C = 6. No WAL reader remains."},{"owner":"Main database","detail":"Safe earlier progress; latest backfill incomplete."},{"owner":"Checkpoint caller","detail":"Previous PASSIVE returned OK with C \u003c L; no retry yet."}]},{"id":"retry","title":"Explicitly retry and finish","body":"With no other active transactions or errors, the caller requests PASSIVE again. Progress can reach C = L = 10. The returned counts include earlier checkpoint work.","why":"The main file now has required latest pages, while PASSIVE still does not promise a zero-byte WAL. Restart and truncation have separate conditions.","boundary":"A second API request, safe file writes, and its return.","nodes":["caller","checkpointer","wal","db"],"edges":["checkpoint","bound","backfill","checkpoint-return"],"claims":["release-retry","count-meaning","file-not-empty","illustration"],"state":[{"owner":"Reader","detail":"Old read transaction ended; no reader remains."},{"owner":"Writer","detail":"Commit through frame 10 returned OK."},{"owner":"WAL + wal-index","detail":"L = 10; C = 10. WAL not truncated by PASSIVE."},{"owner":"Main database","detail":"All required latest page versions backfilled."},{"owner":"Checkpoint caller","detail":"Second PASSIVE returned SQLITE_OK, L = 10, C = 10."}]}]},"sequence":{"title":"Change the checkpoint mode, keep the old snapshot","intro":"Choose a source-derived interleaving. Lanes represent connections, a local checkpoint operation, and files—not separate network services. Repetitive writes and internal API calls are condensed; vertical order is illustrative rather than elapsed time.","lanes":[{"id":"reader","label":"Reader","role":"reader"},{"id":"writer","label":"Writer","role":"writer"},{"id":"caller","label":"Caller","role":"control"},{"id":"checkpointer","label":"Checkpoint","role":"control"},{"id":"wal","label":"WAL + index","role":"wal"},{"id":"db","label":"Main file","role":"db"}],"scenarios":[{"id":"passive-retry","label":"PASSIVE → release → retry","summary":"The writer commits, an old reader limits the first PASSIVE call, then the application ends the reader and explicitly retries successfully.","assumptions":["Source-derived illustration; R = read mark = 6, initial C = 0, and newer committed L = 10. Page P changes from A to B; another page Q has its latest frame at 5 and can be copied safely.","No concurrent checkpoint, new transaction, I/O failure or automatic checkpoint intervenes. The old reader ends only at the shown release event.","Checkpoint callers name main, provide both counts, and hold no active transaction of their own. The shown calls and replies are local C API boundaries."],"events":[{"id":"read-start","from":"reader","to":"reader","label":"Start read: R = 6","kind":"control","body":"Source-derived illustration. The reader selects and holds WAL read mark 6. It can read P = A.","claims":["snapshot","readmark","illustration"],"state":[{"owner":"Reader","detail":"R = 6 held; page P reads A."},{"owner":"Writer","detail":"Commit through frame 6 alre     if (model.sequence) {

        if (scroll) {

          const panel = scrollPanel.getBoundingClientRect();
          const headerHeight = laneHeader.getBoundingClientRect().height;

          const path = eventGroups[eventIndex].querySelector('.sw-message');

          const owners = [...laneHeader.querySelectorAll('[data-lane]')]
            .filter(lane => lane.dataset.lane === event.from || lane.dataset.lane === event.to)
            .map(lane => lane.querySelector('text').getBoundingClientRect());
          const ownerLeft = Math.min(left, ...owners.map(owner => owner.left));
          const ownerRight = Math.max(right, ...owners.map(owner => owner.right));

            left = ownerLeft; right = ownerRight;
          }
          if (right - left <= scrollPanel.clientWidth - margin * 2) {
            if (left < panel.left + margin) scrollPanel.scrollLeft += left - panel.left - margin;

        el('div', { class: 'sw-step-navigation', role: 'group', 'aria-label': 'Sequence navigation' }, previous, position, next),
        el('div', { class: 'sw-walk-layout' }, eventList, host),
        textAlternative('Read all scenarios and directed exchanges', sequence.scenarios.map(scenario => el('article', {}, el('h3', {}, scenario.label), para(scenario.summary), el('ul', {}, scenario.assumptions.map(item => el('li', {}, item))), el('ol', {}, scenario.events.map(event => el('li', {}, el('h4', {}, `${lanes.get(event.from).label} → ${lanes.get(event.to).label}: ${event.label}`), para(event.body), statePanel(event.state), evidence(event.claims))))))));
      root.append(block); selectScenario(0);
    }
    const sourceSection = section(`${uid}-sources`, 'EVIDENCE & BOUNDARIES', 'Sources and limits', 'This is a source-derived explanation. Scenarios illustrate supported behavior; they are not recorded execution traces.');
    sourceSection.append(el('h3', {}, 'Pinned project'), para(`${model.project.name} ${model.project.version} · ${model.project.license}`), link(model.project.revision, `${model.project.repository}/tree/${model.project.revision}`),
      el('h3', {}, 'Primary evidence'), el('ol', { class: 'sw-source-catalog' }, model.sources.map(source => el('li', { id: `${uid}-source-${source.id}` }, link(source.label, source.url), source.note ? para(source.note) : null))),
      el('h3', {}, 'What this model leaves out'), el('ul', {}, model.limits.map(item => el('li', {}, item))),
      textAlternative('Inspect every claim and its evidence', model.claims.map(claim => el('article', {}, el('h4', {}, claim.text), para(claim.kind === 'inference' ? 'Inference from the sources below.' : 'Source-backed assertion.'), sourceLinks(claim.sources)))));

</script><script>SystemWalkthrough.mount(document.getElementById('walkthrough'),JSON.parse(document.getElementById('walkthrough-model').textContent));</script></body></html>
